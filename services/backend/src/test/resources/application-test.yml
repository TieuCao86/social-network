spring:
  config:
    activate:
      on-profile: test

  # Sử dụng Database H2 In-Memory chạy trên RAM (giả lập PostgreSQL dialect)
  datasource:
    url: jdbc:h2:mem:social_network_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop # Tự động tạo bảng theo Entity và xóa sau khi test xong
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Tắt Flyway khi test để H2 tự tạo schema bằng JPA DDL
  flyway:
    enabled: false

# Ghi đè cấu hình JWT với secret cứng (Tránh lỗi không tìm thấy ${JWT_SECRET})
app:
  jwt:
    secret: 9a2f8c4e7b1a5d3f8e6c9b2a4f7e1d3c5b8a0f9e8d7c6b5a4f3e2d1c0b9a8f7e
    expiration-ms: 86400000

  cookie:
    secure: false
    same-site: Lax

logging:
  level:
    root: INFO
    com.socialnetwork: DEBUG

management:
  health:
    redis:
      enabled: false